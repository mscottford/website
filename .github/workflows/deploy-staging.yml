name: Deploy staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# There is a single shared staging environment and a single terraform state
# file, so deploys must not overlap. cancel-in-progress is false because
# interrupting `terraform apply` can strand the state lock or leave a partial
# apply; GitHub only cancels runs still queued, never one already running.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    # Pull requests from forks receive no secrets and no id-token permission, so
    # assuming the deploy role would fail. Skip rather than fail the check.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets:
      calendar_booking_url: ${{ secrets.NEXT_PUBLIC_CALENDAR_BOOKING_URL }}

  comment:
    name: Comment staging URL
    needs: deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          SITE_URL: ${{ needs.deploy.outputs.site_url }}
        with:
          script: |
            const marker = '<!-- staging-deploy -->'
            const body = [
              marker,
              `### Deployed to staging`,
              ``,
              `${process.env.SITE_URL} — updated from ${context.sha.substring(0, 7)}.`,
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const existing = comments.find((c) => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
