version: 2

updates:
  - package-ecosystem: npm # Also handles pnpm via pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Storybook packages must move in lockstep or the build breaks.
      storybook:
        patterns:
          - storybook
          - '@storybook/*'
          - '@chromatic-com/storybook'
      next:
        patterns:
          - next
          - '@next/*'
      # Everything else that isn't a major bump lands as one weekly PR.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: terraform
    directories:
      - /deploy/terraform
      - /deploy/terraform/bootstrap
    schedule:
      interval: weekly
      day: monday
    groups:
      terraform-providers:
        patterns:
          - '*'
