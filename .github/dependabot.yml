version: 2

updates:
  - package-ecosystem: npm # Also handles pnpm via pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Storybook packages must move in lockstep or the build breaks.
      storybook:
        patterns:
          - storybook
          - '@storybook/*'
          - '@chromatic-com/storybook'
      next:
        patterns:
          - next
          - '@next/*'
      # Everything else that isn't a major bump lands as one weekly PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 drops the compiler JavaScript API that ts-node, Next's
      # build-time type check and Storybook's docgen rely on.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep Node's types on the same major as the Node version CI and
      # deploys run (node-version in .github/workflows).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: terraform
    directories:
      - /deploy/terraform
      - /deploy/terraform/bootstrap
    schedule:
      interval: weekly
      day: monday
    groups:
      terraform-providers:
        patterns:
          - '*'
